
<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>
    <style>
        body {
            font-family: Arial;
            background: #eef3ff;
            text-align: center;
            margin: 0;
        }
        header {
            background: #244fc5;
            color: white;
            padding: 25px;
        }
        .card {
            background: white;
            padding: 30px;
            margin: 30px auto;
            width: 70%;
            border-radius: 15px;
        }
        button {
            background: #244fc5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎓 Student Portal</h1>
        <p>Welcome to Your Learning World!</p>
    </header>

    <div class="card">
        <h2>Hello Students!</h2>
        <p>Learn new skills and build your future.</p>
        <h3>Available Courses</h3>
        <p>💻 Web Development</p>
        <p>🐍 Python Programming</p>
        <p>☁️ Cloud Computing</p>
        <button>Explore Courses</button>
    </div>
</body>
</html>
